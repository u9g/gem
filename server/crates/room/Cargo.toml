[package]
name = "gem-room"
version = "0.1.0"
edition = "2024"

[dependencies]
gem-db = { path = "../db" }
livekit = { version = "0.9.7", features = ["rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
livekit-api = { version = "0.9.1", default-features = false, features = ["access-token", "services", "rustls-tls-native-roots"] }
tokio = { version = "1.54.1", features = ["rt", "signal", "sync", "time"] }
tracing = "0.1.44"
