# The server, and beside it in crates/ the layers that depend on nothing of the server's, so each
# can be built and tested alone.
[workspace]
members = ["crates/*"]

[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
gem-db = { path = "crates/db" }
gem-rebases = { path = "crates/rebases" }
livekit = { version = "0.9.7", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.9.1", default-features = false, features = ["access-token", "services", "rustls-tls-native-roots"] }
pbjson = "0.9.0"
pbjson-types = "0.9"
prost = "0.14.4"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "sync", "time", "fs", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
pbjson-build = "0.9.0"
prost-build = "0.14.4"
