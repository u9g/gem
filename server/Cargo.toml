[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
pbjson = "0.9.0"
pbjson-types = "0.9"
prost = "0.14.4"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "sync", "time", "fs", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[build-dependencies]
pbjson-build = "0.9.0"
prost-build = "0.14.4"
