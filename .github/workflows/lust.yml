# Checks and builds the server with lust (https://github.com/t3dotgg/lust-lang), the Rust-subset
# compiler with a warm daemon for fast dev checks, and checks the lust-built server answers as the
# Cargo-built one does. Cargo still builds the release binaries.
name: Lust

on:
  push:
    paths: [server/**, protocol/**, .github/workflows/lust.yml]
  pull_request:
    paths: [server/**, protocol/**, .github/workflows/lust.yml]
  workflow_dispatch:

jobs:
  lust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install lust
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL https://github.com/t3dotgg/lust-lang/releases/download/v0.2.0/lust-0.2.0-x86_64-linux.tar.gz | tar xz
          echo "$PWD/lust-0.2.0-x86_64-linux/bin" >> "$GITHUB_PATH"
      - run: lust --version
      # LiveKit's Linux build dependencies, and clang 21 or later, which libwebrtc's prebuilt
      # libc++ needs (the runner has 18).
      - name: Install LiveKit's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libglib2.0-dev libgbm-dev libdrm-dev libx11-dev             libxext-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxrandr-dev libxtst-dev             libpulse-dev
          curl -sSfL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      # gem-native holds what lust cannot compile (LiveKit, SQLite); the server built by lust runs it.
      - name: Build gem-native and the server with Cargo
        run: cargo build --bins
      - run: ./lust.sh
        env:
          GEM_NATIVE: ${{ github.workspace }}/server/target/debug/gem-native
          CARGO_SERVER: ${{ github.workspace }}/server/target/debug/server
