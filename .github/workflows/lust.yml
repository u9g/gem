# Checks and builds the server with lust (https://github.com/t3dotgg/lust-lang), the Rust-subset
# compiler with a warm daemon for fast dev checks, runs its tests built by lust, and checks the
# lust-built server answers as the Cargo-built one does. Cargo still builds the release binaries.
name: Lust

on:
  push:
    paths: [server/**, protocol/**, .github/workflows/lust.yml]
  pull_request:
    paths: [server/**, protocol/**, .github/workflows/lust.yml]
  workflow_dispatch:

jobs:
  lust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install lust
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL https://github.com/t3dotgg/lust-lang/releases/download/v0.2.0/lust-0.2.0-x86_64-linux.tar.gz | tar xz
          echo "$PWD/lust-0.2.0-x86_64-linux/bin" >> "$GITHUB_PATH"
      - run: lust --version
      # gem-native holds what lust cannot compile (LiveKit, SQLite); the server built by lust runs it.
      - name: Build gem-native and the server with Cargo
        run: cargo build --bins
      - run: ./lust.sh
        env:
          GEM_NATIVE: ${{ github.workspace }}/server/target/debug/gem-native
          CARGO_SERVER: ${{ github.workspace }}/server/target/debug/server
