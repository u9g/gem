syntax = "proto3";

package gem.v1;

import "google/protobuf/timestamp.proto";

// Sent by the frontend to ask the server for all open pull requests.
message ListOpenPullRequestsRequest {}

// Also sent by the server to every frontend in the room, as a text stream on the topic `prs`,
// whenever it changes.
message ListOpenPullRequestsResponse {
  // Most recently updated first, by the latest update to any PR in the cluster.
  repeated PullRequestCluster clusters = 1;
  // GitHub login of the user the server runs as. Their PRs are listed, and
  // proposals are run as them.
  string login = 2;
  // The search qualifiers narrowing their PRs, from GEM_SEARCH, e.g.
  // `org:livekit`. Empty when every open PR of theirs is listed.
  string search = 3;
  reserved 4;
  reserved "investigations";
  // The agents acting on no open pull request, most recently started first. Every other agent is in
  // the cluster holding its pull requests, so each agent is listed once.
  repeated Agent agents = 5;
}

// A T3 Code agent gem started: answering a conversation or failed checks, rebasing or merging pull
// requests, investigating failed checks, doing an approved proposal's follow-up, or answering the
// user's message about a cluster. Each is followed the same way: its latest reply shows in gem, and
// the user answers it by messaging it. Its thread stays in T3 Code after it is closed.
message Agent {
  string id = 1;
  // What it was asked to do, in a line: its thread's title.
  string title = 2;
  AgentState state = 3;
  // The pull requests it acts on. It belongs to the one cluster holding those still open, whatever
  // the cluster is called or becomes; with none still open, it belongs to no cluster.
  repeated string pull_request_urls = 4;
  // Its latest reply, in markdown. Empty until its first reply.
  string reply = 5;
  // `reply` as GitHub renders it.
  string reply_html = 6;
  // What it proposes that shows under it rather than on a pull request.
  repeated Proposal proposals = 7;
  google.protobuf.Timestamp started_at = 8;
}

enum AgentState {
  // Running, on its first prompt or on a message the user sent.
  AGENT_STATE_WORKING = 0;
  // Waiting for other agents to finish before it starts.
  AGENT_STATE_QUEUED = 1;
  // Stopped, waiting on the user: to answer its reply, or to review its proposals.
  AGENT_STATE_WAITING = 2;
}

// Pull requests connected by links, directly or through other PRs in the
// cluster. Two PRs are linked when one is stacked on the other (its base branch
// is the other's head branch in the same repository), one mentions the other, or
// an agent acts on both.
// Oldest PR first.
message PullRequestCluster {
  repeated PullRequest pull_requests = 1;
  // Latest update to any PR in the cluster.
  google.protobuf.Timestamp updated_at = 2;
  // Short name for the cluster's shared work, chosen by a T3 Code thread. Empty
  // until that thread replies.
  string name = 3;
  // How the cluster can merge: by approval when every pull request merges by approval, unspecified
  // when any cannot merge, and by admin otherwise.
  MergeBy merge_by = 4;
  // The agents acting on any of its pull requests, whatever their state, most recently started
  // first.
  repeated Agent agents = 5;
}

message PullRequest {
  Repository repository = 1;
  uint32 number = 2;
  string title = 3;
  string url = 4;
  // GitHub's review decision is APPROVED: enough approvals, no outstanding change requests.
  bool approved = 5;
  // Every check on the head commit passed. True when the head commit has no checks.
  bool checks_passing = 6;
  // A check on the head commit failed or errored. False while checks are only pending.
  bool checks_failing = 7;
  // Proposed answers to conversations on this PR that still wait on the user.
  repeated Proposal proposals = 8;
  // GitHub will not merge it until the head branch is rebased onto the base branch: the base
  // branch requires it up to date, or it conflicts.
  bool behind = 9;
  reserved 10, 13, 14;
  reserved "rebase", "agents", "merge";
  // The checks on the head commit, by how far along they are.
  Checks checks = 11;
  // Commit at the tip of the head branch.
  string head_oid = 12;
  // How the user can merge it.
  MergeBy merge_by = 15;
  // The PR's diff of each file a proposal on it is about: the file a review
  // comment is on, and the files a patch changes.
  repeated FileDiff files = 16;
  // The branch it merges into.
  string base = 17;
  // It conflicts with the base branch. Implies behind.
  bool conflicts = 18;
  // An agent is rebasing it onto its base branch.
  bool rebasing = 19;
  // An agent pushed it rebased, and it is still listed with its old head commit and that commit's
  // checks.
  bool rebased = 20;
  // An agent is merging its cluster.
  bool merging = 21;
  // Why the agent that answered the head commit's failed checks proposed nothing, in its words.
  // Empty until it finishes, and when it proposed something.
  string no_proposal_reason = 22;
  google.protobuf.Timestamp created_at = 23;
}

// How a pull request can merge, decided by the server.
enum MergeBy {
  // It cannot: its checks do not all pass, or it is not approved and the user is not an admin of
  // its repository.
  MERGE_BY_UNSPECIFIED = 0;
  // Its checks pass and it is approved.
  MERGE_BY_APPROVAL = 1;
  // Its checks pass but it is not approved. The user is an admin of its repository, so can force it
  // in past review with `gh pr merge --admin`.
  MERGE_BY_ADMIN = 2;
}

// Check runs and commit statuses on a pull request's head commit.
message Checks {
  uint32 total = 1;
  // Finished, whatever their conclusion.
  uint32 done = 2;
  // Finished with FAILURE, TIMED_OUT or STARTUP_FAILURE for a check run, or FAILURE or ERROR for
  // a commit status. Agents answer failed checks once every check is done.
  uint32 failed = 3;
}

message Repository {
  // Organization or user login, e.g. livekit.
  string owner = 1;
  // e.g. agents.
  string name = 2;
}

// An answer an agent proposes to a conversation on a pull request, or to its
// failing checks, run as the user once approved. Approving runs the steps that
// are set in this order: follow_up, patch, other_patches, reply, resolve_thread,
// rerun, close_pull_request. A step that succeeded is cleared, so approving
// again after a failure resumes at the step that failed.
message Proposal {
  string id = 1;
  // One line saying what approving does.
  string summary = 2;
  string pull_request_url = 3;
  // Latest comment in the conversation when the agent started. The proposal is
  // shown only while this is still the latest comment waiting on the user.
  Comment comment = 4;
  // Review thread holding the comment. Empty when the comment is a top-level
  // comment.
  string thread_id = 5;
  Patch patch = 6;
  // Markdown posted as the user: a reply in the review thread, or a top-level
  // comment, which opens by quoting `comment`.
  string reply = 7;
  bool resolve_thread = 8;
  // Why the last approval failed.
  string error = 9;
  // A tool the agent needed to answer and lacks, in markdown: what it would do
  // and why this conversation needs it. Set only on proposals with no steps,
  // which approving does not run.
  string requested_tool = 10;
  // The comments before `comment` in its review thread, oldest first, so the
  // whole thread can be read. Empty for a top-level comment.
  repeated Comment earlier_comments = 11;
  // `reply` as GitHub renders it.
  string reply_html = 12;
  // A prompt for a T3 Code agent to finish what the reply promises, when that
  // is too big for a patch here, such as changes across repositories.
  // Approving starts the agent before the other steps.
  string follow_up = 13;
  // `follow_up` as GitHub renders it.
  string follow_up_html = 14;
  // Closes the pull request without merging it.
  bool close_pull_request = 15;
  // Set instead of `comment` when the proposal answers failing checks.
  CheckFailure check_failure = 16;
  // Reruns the failed jobs of the GitHub Actions runs in `check_failure`.
  bool rerun = 17;
  // `summary` as GitHub renders it.
  string summary_html = 18;
  // The agent's ID, set instead of `comment` and `check_failure` when an agent investigating or
  // answering the user's message proposes it. It shows in that agent's `proposals` while the agent
  // is open, whatever happens to its pull request. Approving it clears no other proposal. Named for
  // investigations, which were the only such agents, so saved proposals keep it.
  string investigation_id = 19;
  // Changes to other pull requests of its cluster, each committed and pushed
  // to its own pull request's head branch.
  repeated Patch other_patches = 20;
}

// The checks that failed on a pull request's head commit, once all of its
// checks finished.
message CheckFailure {
  // The head commit and the failing checks' node IDs. A proposal is shown only
  // while this is still the pull request's failure, so a push or a rerun that
  // fails again makes a new one.
  string id = 1;
  string head_oid = 2;
  // The failed checks the proposal answers, which may be only some of them.
  // Proposals that answer a check in common are alternatives: approving one
  // clears the others.
  repeated FailedCheck checks = 3;
}

// A check run or commit status that failed.
message FailedCheck {
  // GraphQL node ID.
  string id = 1;
  string name = 2;
  // FAILURE, TIMED_OUT or STARTUP_FAILURE for a check run; FAILURE or ERROR
  // for a commit status.
  string conclusion = 3;
  string url = 4;
  // The GitHub Actions workflow run it belongs to. 0 for checks outside GitHub
  // Actions, which cannot be rerun.
  uint64 workflow_run_id = 5;
  // The lines of its log that show why it failed, as picked by the agent that
  // proposed the answer. Empty when the agent picked none.
  string excerpt = 6;
}

message Comment {
  // GraphQL node ID.
  string id = 1;
  // Login of the author.
  string author = 2;
  // Markdown.
  string body = 3;
  string url = 4;
  // The body as GitHub renders it.
  string body_html = 5;
  // A review comment's file, and its line in the PR's diff when the proposal was made: 0 if it was
  // outdated by then, and on a top-level comment, whose path is empty too.
  string path = 6;
  uint32 line = 7;
  // A review comment's hunk of the PR's diff then, ending at its line.
  string diff_hunk = 8;
}

// One file's part of a pull request's diff.
message FileDiff {
  string path = 1;
  // GitHub's hunks for the file, without a file header. Empty for a file too
  // large for GitHub to diff.
  string patch = 2;
}

// Committed and pushed to the pull request's head branch.
message Patch {
  // Unified diff against the head of the branch.
  string diff = 1;
  string commit_message = 2;
  // The branch's head commit when the diff was checked. Once the branch moves
  // past it, the proposal is replaced by a new agent's answer.
  string head_oid = 3;
  // The pull request it changes, on a patch in `other_patches`. Empty on
  // `patch`, which changes the proposal's own pull request.
  string pull_request_url = 4;
}

// Runs the proposal. Its outcome shows in the proposal: it disappears, along
// with the other proposals for the same comment, or its error is set. A
// proposal that closes its pull request takes the pull request and all of its
// proposals with it.
message ApproveProposalRequest {
  string id = 1;
  // The user's rewrite of the proposal's reply, posted in its place. Empty posts the
  // reply as proposed.
  string reply = 2;
  // The user's rewrite of the proposal's follow-up prompt, run in its place. Empty
  // runs the prompt as proposed.
  string follow_up = 3;
  // The user's rewrite of the proposal's patch diff, committed in its place. Empty
  // commits the patch as proposed.
  string diff = 4;
}

message ApproveProposalResponse {}

message DismissProposalRequest {
  string id = 1;
}

message DismissProposalResponse {}

// Markdown as GitHub renders it in a comment on the pull request, for showing the user's rewrite
// of a proposal's reply or follow-up as it would be posted.
message RenderMarkdownRequest {
  string pull_request_url = 1;
  string markdown = 2;
}

message RenderMarkdownResponse {
  string html = 1;
}

// Deletes every proposal on the cluster's pull requests and queues new agents for the
// conversations still waiting on the user. The agents show in `agents`.
message RestartClusterRequest {
  repeated string pull_request_urls = 1;
}

message RestartClusterResponse {}

// Starts a T3 Code agent rebasing the pull request onto its base branch. Its progress shows in
// `agents`.
message RebasePullRequestRequest {
  string url = 1;
}

message RebasePullRequestResponse {}

// Starts one T3 Code agent rebasing each of the cluster's pull requests onto its base branch,
// stacked ones after those they stack on. Its progress shows in `agents`.
message RebaseClusterRequest {
  repeated string pull_request_urls = 1;
}

message RebaseClusterResponse {}

// Starts a T3 Code agent merging the cluster's pull requests, in an order that keeps each one's
// base. Its progress shows in `agents`.
message MergeClusterRequest {
  // The cluster's pull requests, oldest first.
  repeated string pull_request_urls = 1;
  // The user chose to force the cluster's unapproved pull requests in as an admin. Without it, a
  // cluster that merges by admin is refused.
  bool admin = 2;
}

message MergeClusterResponse {}

// Asks a model, for each open pull request, whether its title and description match the query.
message SearchPullRequestsRequest {
  string query = 1;
}

message SearchPullRequestsResponse {
  // The pull requests that match. A cluster matches when any of its pull requests does.
  repeated string pull_request_urls = 1;
}

// Starts an agent on the user's message about a cluster. The agent reads the cluster and its pull requests through gem's MCP server.
message MessageClusterRequest {
  // The cluster's pull requests, oldest first.
  repeated string pull_request_urls = 1;
  string message = 2;
}

message MessageClusterResponse {
  string agent_id = 1;
}

// Approves a rerun proposal, then starts an investigation of the checks it reruns.
message InvestigateRequest {
  string proposal_id = 1;
}

message InvestigateResponse {}

// Sends the user's message to an agent, as its next turn.
message MessageAgentRequest {
  string id = 1;
  string message = 2;
}

message MessageAgentResponse {}

// Removes an agent and its proposals from gem. Its T3 Code thread stays.
message CloseAgentRequest {
  string id = 1;
}

message CloseAgentResponse {}
