syntax = "proto3";

package gem.v1;

// Sent by the frontend to ask the server for all open pull requests.
message ListOpenPullRequestsRequest {}

message ListOpenPullRequestsResponse {
  repeated PullRequestCluster clusters = 1;
}

// Pull requests stacked on one another: a PR depends on another when its base
// branch is the other's head branch in the same repository. Each PR comes after
// the PR it depends on.
message PullRequestCluster {
  repeated PullRequest pull_requests = 1;
}

message PullRequest {
  // owner/name, e.g. livekit/agents.
  string repository = 1;
  uint32 number = 2;
  string title = 3;
  string url = 4;
}
